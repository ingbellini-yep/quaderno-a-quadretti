<meta charset="utf-8">
<title>Quaderno a Quadretti</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Asap:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
:root{
  --ground:#F2F5F9; --grid:#E1E8F1; --surface:#FFFFFF; --surface-2:#F7F9FC;
  --ink:#141C27; --ink-2:#37475C; --muted:#64798F; --line:#D7E0EB; --line-strong:#B9C7D8;
  --mat:#2C5AA0; --mat-soft:#E7EEF9;
  --fis:#A85A2E; --fis-soft:#F8EDE5;
  --ok:#16785A; --ok-soft:#E1F1EA;
  --warn:#9E6712; --warn-soft:#F8EEDC;
  --err:#A8353A; --err-soft:#F8E6E7;
  --shadow:0 1px 2px rgba(20,28,39,.06), 0 6px 18px -10px rgba(20,28,39,.22);
  --radius:10px;
  --on-accent:#FFFFFF;
  --accent:var(--mat); --accent-soft:var(--mat-soft);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D131A; --grid:#18222D; --surface:#151E28; --surface-2:#1B2631;
    --ink:#E5ECF4; --ink-2:#BCC9D8; --muted:#8798AB; --line:#27333F; --line-strong:#3A4957;
    --mat:#83AAEC; --mat-soft:#1B2940;
    --fis:#E1966E; --fis-soft:#37261C;
    --ok:#5BC59B; --ok-soft:#143026;
    --warn:#DFAE55; --warn-soft:#332715;
    --err:#E58185; --err-soft:#3A1D1F;
    --on-accent:#0B1119;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#0D131A; --grid:#18222D; --surface:#151E28; --surface-2:#1B2631;
  --ink:#E5ECF4; --ink-2:#BCC9D8; --muted:#8798AB; --line:#27333F; --line-strong:#3A4957;
  --mat:#83AAEC; --mat-soft:#1B2940;
  --fis:#E1966E; --fis-soft:#37261C;
  --ok:#5BC59B; --ok-soft:#143026;
  --warn:#DFAE55; --warn-soft:#332715;
  --err:#E58185; --err-soft:#3A1D1F;
  --on-accent:#0B1119;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Asap","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:16px; line-height:1.55;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
h1,h2,h3,h4{font-family:"Spectral",Georgia,"Times New Roman",serif; font-weight:600; text-wrap:balance; margin:0}
a{color:var(--accent)}
button{font:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

/* ---------- intestazione ---------- */
.testata{
  position:sticky; top:0; z-index:40;
  background:var(--surface); border-bottom:1px solid var(--line);
}
.testata-in{
  max-width:1280px; margin:0 auto; padding-block:12px; padding-left:20px; padding-right:20px;
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
}
.marchio{display:flex; align-items:baseline; gap:10px; margin-right:auto; background:none; border:0; padding:0; color:inherit; text-align:left}
.marchio b{font-family:"Spectral",serif; font-size:21px; font-weight:700; letter-spacing:-.01em}
.marchio span{font-size:12px; color:var(--muted); letter-spacing:.09em; text-transform:uppercase}
.badge-sync{
  font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--muted);
  border:1px solid var(--line); border-radius:999px; padding:3px 10px; white-space:nowrap;
}
.badge-sync.on{color:var(--ok); border-color:var(--ok)}
.btn-indice{display:none}

/* ---------- impianto ---------- */
.impianto{max-width:1280px; margin:0 auto; display:grid; grid-template-columns:288px minmax(0,1fr); gap:28px;
  padding-left:20px; padding-right:20px; padding-block:26px; align-items:start}

/* ---------- indice laterale ---------- */
.rail{position:sticky; top:74px; display:flex; flex-direction:column; gap:18px}
.rail-blocco{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
.rail-testa{display:flex; align-items:center; gap:9px; padding:11px 14px; border-bottom:1px solid var(--line); background:var(--surface-2)}
.rail-testa .sigla{
  width:24px; height:24px; display:grid; place-items:center; border-radius:6px;
  font-family:"IBM Plex Mono",monospace; font-size:13px; font-weight:500; color:#fff;
}
.rail-testa h3{font-size:14px; letter-spacing:.06em; text-transform:uppercase; font-family:"Asap",sans-serif; font-weight:600}
.rail-anno{padding:9px 14px 3px; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:600}
.voce{
  width:100%; text-align:left; background:none; border:0; border-left:3px solid transparent;
  padding:8px 14px 8px 11px; display:flex; gap:8px; align-items:flex-start; color:var(--ink-2); font-size:14.5px;
}
.voce:hover{background:var(--surface-2); color:var(--ink)}
.voce.attiva{background:var(--accent-soft); border-left-color:var(--accent); color:var(--ink); font-weight:500}
.voce .txt{flex:1; line-height:1.35}
.punti{display:flex; gap:3px; padding-top:5px; flex-shrink:0}
.punto{width:7px; height:7px; border-radius:50%; border:1.5px solid var(--line-strong); background:transparent}
.punto.fatto{background:var(--ok); border-color:var(--ok)}
.punto.provato{background:var(--warn); border-color:var(--warn)}
.rail-nota{padding:8px 14px 12px; font-size:12.5px; color:var(--muted); border-top:1px dashed var(--line); margin-top:6px}

/* ---------- contenuto ---------- */
.main{min-width:0; display:flex; flex-direction:column; gap:22px}
.scheda{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
.scheda-in{padding:22px 24px}
.occhiello{font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:600; font-family:"Asap",sans-serif}

.copertina{padding:26px 24px; border-left:4px solid var(--accent)}
.copertina h1{font-size:clamp(25px,3.6vw,34px); line-height:1.15; margin:6px 0 10px}
.copertina p{margin:0; color:var(--ink-2); max-width:62ch}

.sezione > h2{
  font-size:19px; margin-bottom:2px;
  display:flex; align-items:center; gap:10px;
}
.sezione > h2::after{content:""; flex:1; height:1px; background:var(--line)}
.sez-sub{color:var(--muted); font-size:13.5px; margin:2px 0 16px}

.pillole{display:grid; grid-template-columns:repeat(auto-fit,minmax(272px,1fr)); gap:1px; background:var(--line);
  border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
.pillola{background:var(--surface); padding:16px 18px}
.pillola h4{font-size:15.5px; margin-bottom:5px; font-family:"Asap",sans-serif; font-weight:600}
.pillola p{margin:0; font-size:14.5px; color:var(--ink-2)}

.formulario{display:grid; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
.formula{background:var(--surface); display:grid; grid-template-columns:minmax(150px,auto) 1fr; gap:14px; align-items:center; padding:12px 18px}
.formula .nome{font-size:13px; color:var(--muted); letter-spacing:.03em}
.formula .corpo{overflow-x:auto}

.esempio{border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:var(--surface)}
.esempio + .esempio{margin-top:12px}
.esempio .consegna{background:var(--surface-2); padding:12px 18px; border-bottom:1px solid var(--line); font-weight:500}
.esempio ol{margin:0; padding:14px 18px 14px 36px; display:grid; gap:7px; color:var(--ink-2); font-size:14.5px}
.esempio .esito{padding:11px 18px; border-top:1px dashed var(--line); background:var(--ok-soft); color:var(--ink);
  display:flex; gap:9px; align-items:center; flex-wrap:wrap}
.esempio .esito b{font-size:12px; letter-spacing:.09em; text-transform:uppercase; color:var(--ok)}

.risorse{display:grid; gap:8px}
.risorsa{display:flex; gap:12px; align-items:baseline; padding:10px 14px; border:1px solid var(--line);
  border-radius:8px; background:var(--surface); text-decoration:none; color:var(--ink)}
.risorsa:hover{border-color:var(--accent)}
.risorsa .fonte{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--muted);
  border:1px solid var(--line); border-radius:4px; padding:1px 6px; flex-shrink:0}
.risorsa .t{flex:1; font-size:14.5px}
.risorsa .frec{color:var(--muted)}

/* ---------- livelli / palestra ---------- */
.livelli{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px}
.livello{border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); padding:16px 17px;
  display:flex; flex-direction:column; gap:9px}
.livello.bloccato{background:var(--surface-2); color:var(--muted)}
.livello .grado{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.livello h4{font-size:17px}
.livello p{margin:0; font-size:13.5px; color:var(--muted); flex:1}
.stato{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:3px 9px; border-radius:999px;
  align-self:flex-start; font-variant-numeric:tabular-nums}
.stato.ok{background:var(--ok-soft); color:var(--ok)}
.stato.parz{background:var(--warn-soft); color:var(--warn)}
.stato.chiuso{background:var(--surface-2); color:var(--muted); border:1px solid var(--line)}

.btn{border:1px solid var(--accent); background:var(--accent); color:var(--on-accent); padding:9px 16px;
  border-radius:8px; font-weight:600; font-size:14.5px}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45; cursor:not-allowed; filter:none}
.btn.ghost{background:transparent; color:var(--accent)}
.btn.neutro{background:var(--surface); border-color:var(--line-strong); color:var(--ink)}
.btn.piccolo{padding:6px 12px; font-size:13.5px}

/* ---------- quiz ---------- */
.quiz{max-width:820px; margin:0 auto; width:100%}
.quiz-testa{display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:16px 22px; border-bottom:1px solid var(--line)}
.quiz-testa .qt{flex:1; min-width:180px}
.quiz-testa h2{font-size:17px}
.quiz-testa .sub{font-size:12.5px; color:var(--muted)}
.passi{display:flex; gap:5px; flex-wrap:wrap}
.passo{width:22px; height:5px; border-radius:3px; background:var(--line)}
.passo.fatto{background:var(--accent)}
.passo.ora{background:var(--ink)}
.domanda{padding:26px 24px}
.domanda .num{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--muted); letter-spacing:.08em}
.domanda .testo{font-size:19px; line-height:1.5; margin:8px 0 20px}
.campo{display:flex; gap:10px; flex-wrap:wrap}
.campo input[type=text]{
  flex:1; min-width:200px; padding:11px 14px; border:1.5px solid var(--line-strong); border-radius:8px;
  background:var(--surface-2); color:var(--ink); font-family:"IBM Plex Mono",monospace; font-size:16px;
}
.campo input[type=text]:focus{border-color:var(--accent); outline:none; background:var(--surface)}
.opzioni{display:grid; gap:9px}
.opz{display:flex; gap:11px; align-items:flex-start; padding:12px 15px; border:1.5px solid var(--line);
  border-radius:8px; background:var(--surface-2); cursor:pointer}
.opz:hover{border-color:var(--line-strong)}
.opz.sel{border-color:var(--accent); background:var(--accent-soft)}
.opz input{margin-top:5px; accent-color:var(--accent)}
.azioni{display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; align-items:center}
.suggerimento{font-size:13px; color:var(--muted); margin-top:14px}

/* ---------- esito ---------- */
.punteggio{display:flex; align-items:center; gap:22px; padding:22px 24px; flex-wrap:wrap; border-bottom:1px solid var(--line)}
.voto{font-family:"IBM Plex Mono",monospace; font-size:38px; font-weight:500; font-variant-numeric:tabular-nums; line-height:1}
.voto small{font-size:19px; color:var(--muted)}
.punteggio .msg{flex:1; min-width:220px}
.punteggio .msg h2{font-size:20px; margin-bottom:3px}
.punteggio .msg p{margin:0; color:var(--ink-2); font-size:14.5px}
.revisione{display:grid; gap:14px; padding:20px 24px}
.rev{border:1px solid var(--line); border-left:3px solid var(--line-strong); border-radius:8px; background:var(--surface); overflow:hidden}
.rev.giusta{border-left-color:var(--ok)}
.rev.sbagliata{border-left-color:var(--err)}
.rev-testa{padding:13px 16px; display:flex; gap:11px; align-items:flex-start}
.rev-testa .n{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--muted); padding-top:3px}
.rev-testa .q{flex:1; font-size:15.5px}
.esitino{font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; padding:2px 8px; border-radius:999px; white-space:nowrap}
.esitino.ok{background:var(--ok-soft); color:var(--ok)}
.esitino.no{background:var(--err-soft); color:var(--err)}
.rev-corpo{padding:0 16px 14px 16px; display:grid; gap:10px}
.riga-risp{display:grid; grid-template-columns:auto 1fr; gap:8px 12px; font-size:14px; align-items:baseline}
.riga-risp dt{color:var(--muted); font-size:12px; letter-spacing:.05em; text-transform:uppercase}
.riga-risp dd{margin:0; font-family:"IBM Plex Mono",monospace}
.spiegazione{background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:12px 15px; font-size:14.5px; color:var(--ink-2)}
.spiegazione strong{color:var(--ink)}
.capito{display:flex; gap:9px; align-items:center; flex-wrap:wrap; font-size:13.5px; color:var(--muted)}
.approfondimento{background:var(--accent-soft); border:1px dashed var(--accent); border-radius:8px; padding:13px 15px; font-size:14.5px; white-space:pre-wrap}
.chiuso-ok{color:var(--ok); font-weight:600; font-size:13.5px}

.vuoto{padding:34px 24px; text-align:center; color:var(--muted)}
.vuoto h3{font-size:18px; color:var(--ink); margin-bottom:6px}

.cruscotto{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px; background:var(--line);
  border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
.tassello{background:var(--surface); padding:15px 17px}
.tassello .k{font-family:"IBM Plex Mono",monospace; font-size:27px; font-variant-numeric:tabular-nums; line-height:1.1}
.tassello .e{font-size:12px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; margin-top:4px}

.come-si-usa{display:grid; gap:9px; counter-reset:passo}
.come-si-usa li{font-size:14.5px; color:var(--ink-2)}

@media (max-width:900px){
  .impianto{grid-template-columns:minmax(0,1fr); gap:18px}
  .rail{position:static; display:none}
  .rail.aperto{display:flex}
  .btn-indice{display:inline-flex}
  .testata-in{padding-block:10px}
}

/* ---------- refresh: studio quest ---------- */
:root{

  --fis:#ff6b4a; --fis-soft:#fff0eb; --ok:#18a879; --ok-soft:#e5f8f1; --warn:#ee9b19;

  --shadow:0 12px 32px -20px rgba(66,42,123,.28);
}

:root[data-theme="dark"]{--ground:#171326;--surface:#211b35;--surface-2:#29213f;--ink:#f5f0ff;--ink-2:#d2c9e7;--muted:#aaa0c4;--line:#40355f;--line-strong:#5c4d7f;--mat:#a895ff;--mat-soft:#332956;--fis:#ff9a83;--fis-soft:#493029;--ok:#55d6a6;--ok-soft:#193d35;--warn:#ffc95c;--warn-soft:#4a3a1f;--err:#ff8ca5;--err-soft:#4b2434;--shadow:0 12px 32px -20px #080510}
body{font-family:"Asap","Segoe UI",system-ui,sans-serif;background-color:var(--ground);background-image:radial-gradient(circle at 8% 0%,rgba(113,87,246,.13),transparent 24rem),radial-gradient(circle at 96% 18%,rgba(255,107,74,.12),transparent 27rem),linear-gradient(rgba(113,87,246,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(113,87,246,.035) 1px,transparent 1px);background-size:auto,auto,28px 28px,28px 28px}
h1,h2,h3,h4{font-family:"Asap","Segoe UI",sans-serif;font-weight:700;letter-spacing:-.035em}
.testata{background:rgba(255,255,255,.84);backdrop-filter:blur(16px);border-bottom:1px solid rgba(227,223,242,.7)}
.marchio{align-items:center}.marchio b{font-family:"Asap",sans-serif;font-size:20px;letter-spacing:-.045em}.marchio b:before{content:"✦";display:inline-grid;place-items:center;width:30px;height:30px;margin-right:9px;border-radius:10px;background:linear-gradient(135deg,#765cf7,#aa69ff);color:white;font-size:16px;box-shadow:0 5px 12px rgba(113,87,246,.3)}
.marchio span{font-weight:700;color:#877da5;font-size:10px}.badge-sync{background:#fff;border-color:#e6e0f3;color:#786f91;box-shadow:0 3px 10px rgba(66,42,123,.05)}

<script>
(function(){
"use strict";

/* ===================================================================
   STRUTTURA DEL CORSO
   Per aggiungere una materia: un nuovo oggetto qui, con il suo file
   di contenuti caricato come <script src="...">.
   Per aggiungere un anno: una nuova chiave dentro "anni".
   =================================================================== */
var MATERIE = [
  { id:"matematica", nome:"Matematica", sigla:"∑", accento:"mat",
    anni:{ 1: (window.CONTENUTI_MATEMATICA || []) } },
  { id:"fisica", nome:"Fisica", sigla:"ƒ", accento:"fis",
    anni:{ 1: (window.CONTENUTI_FISICA || []) } }
];
var ANNI = [1,2,3,4,5];
var SOGLIA = 6;              // risposte corrette necessarie per sbloccare il livello successivo
var PER_BATTERIA = 10;

/* =================== stato =================== */
var S = {
  vista:"home", materia:null, anno:1, argomento:null,
  quiz:null, prog:{}, db:null, sample:null, mathPronto:false
};

var $main = document.getElementById("main");
var $rail = document.getElementById("rail");
var $badge = document.getElementById("badge-sync");

/* =================== utilità =================== */
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function tex(el){
  if(window.MathJax && window.MathJax.typesetPromise){
    try{ window.MathJax.typesetPromise(el?[el]:undefined).catch(function(){}); }catch(e){}
  }
}
function trovaArgomento(id){
  for(var i=0;i<MATERIE.length;i++){
    var m=MATERIE[i];
    for(var a in m.anni){
      var lista=m.anni[a]||[];
      for(var j=0;j<lista.length;j++){
        if(lista[j].id===id) return {mat:m, anno:Number(a), arg:lista[j]};
      }
    }
  }
  return null;
}
function progDi(argId, liv){
  var p = S.prog[argId];
  if(!p) return null;
  return p[liv] || null;
}
function superatoP(p){ return !!(p && p.migliore >= (p.soglia||SOGLIA)); }
function totaleDi(p){ return (p && p.totale) || PER_BATTERIA; }
function sogliaDi(arg, liv){
  var n = arg.livelli[liv].items.length;
  return n===PER_BATTERIA ? SOGLIA : Math.max(1, Math.ceil(n*SOGLIA/PER_BATTERIA));
}
function sbloccato(argId, liv){
  if(liv===0) return true;
  return superatoP(progDi(argId, liv-1));
}
function setAccento(materia){
  var r=document.documentElement;
  if(materia && materia.accento==="fis"){
    r.style.setProperty("--accent","var(--fis)");
    r.style.setProperty("--accent-soft","var(--fis-soft)");
  } else {
    r.style.setProperty("--accent","var(--mat)");
    r.style.setProperty("--accent-soft","var(--mat-soft)");
  }
}

/* =================== correzione delle risposte =================== */
function normalizza(t){
  return String(t==null?"":t).toLowerCase().trim()
    .replace(/[−–—]/g,"-")
    .replace(/²/g,"^2").replace(/³/g,"^3").replace(/⁴/g,"^4")
    .replace(/\s+/g,"")
    .replace(/[×·∙*]/g,"")
    .replace(/\^/g,"")
    .replace(/,/g,".")
    .replace(/^\+/,"")
    .replace(/[.;]+$/,"");
}
function numeroDa(t){
  var m = String(t==null?"":t).replace(/\s/g,"").replace(",",".").match(/-?\d+(?:\.\d+)?/);
  return m ? parseFloat(m[0]) : null;
}
function corretta(item, risposta){
  if(risposta==null || String(risposta).trim()==="") return false;
  if(item.tipo==="scelta") return Number(risposta) === Number(item.ok);
  if(item.num){
    var n = numeroDa(risposta);
    if(n!==null){
      var tol = (typeof item.num.tol==="number") ? item.num.tol : 0.001;
      if(Math.abs(n - item.num.v) <= Math.max(tol, 1e-9)) return true;
    }
  }
  var r = normalizza(risposta);
  var sol = item.sol || [];
  for(var i=0;i<sol.length;i++){ if(normalizza(sol[i])===r) return true; }
  return false;
}
function rispostaGiusta(item){
  if(item.tipo==="scelta") return item.opz[item.ok];
  if(item.sol && item.sol.length) return item.sol[0];
  if(item.num) return item.num.v + (item.num.u ? " " + item.num.u : "");
  return "-";
}

/* =================== persistenza =================== */
var CHIAVE = "quaderno-quadretti-progressi";
/* I progressi sono indicizzati per id di argomento e per indice di livello: aggiungere
   argomenti o livelli nuovi non li tocca, purché gli id esistenti non cambino mai.
   Le voci relative a id non più presenti vengono conservate, non cancellate. */
function caricaLocale(){
  var raw = null;
  try{ raw = localStorage.getItem(CHIAVE); }catch(e){}
  if(!raw) return {};
  try{ var p = JSON.parse(raw); if(p && typeof p==="object") return p; }catch(e){}
  // salvataggio illeggibile: se ne tiene una copia prima di ripartire da zero
  try{ localStorage.setItem(CHIAVE+"-copia-"+Date.now(), raw); }catch(e){}
  return {};
}
function salvaLocale(){
  try{ localStorage.setItem(CHIAVE, JSON.stringify(S.prog)); }catch(e){}
}
function salvaProgressi(){
  salvaLocale();
  if(S.db){
    try{
      S.db.doc("progressi/studente").set({
        argomenti: S.prog,
        aggiornato: new Date().toISOString()
      }).catch(function(){});
    }catch(e){}
  }
}
function registraEsito(argId, liv, punti, soglia, totale){
  if(!S.prog[argId]) S.prog[argId] = {};
  var p = S.prog[argId][liv] || {migliore:0, tentativi:0};
  p.tentativi = (p.tentativi||0) + 1;
  p.migliore = Math.max(p.migliore||0, punti);
  p.ultimo = punti;
  p.soglia = soglia; p.totale = totale;
  p.data = new Date().toISOString();
  S.prog[argId][liv] = p;
  salvaProgressi();
}

/* =================== indice laterale =================== */
function renderRail(){
  var html = "";
  MATERIE.forEach(function(m){
    var col = m.accento==="fis" ? "var(--fis)" : "var(--mat)";
    html += '<section class="rail-blocco">';
    html += '<div class="rail-testa"><span class="sigla" style="background:'+col+'">'+m.sigla+'</span><h3>'+esc(m.nome)+'</h3></div>';
    ANNI.forEach(function(anno){
      var lista = m.anni[anno] || [];
      if(!lista.length) return;
      html += '<div class="rail-anno">'+anno+'º anno</div>';
      lista.forEach(function(a){
        var attiva = (S.argomento===a.id) ? " attiva" : "";
        var punti = "";
        for(var l=0;l<a.livelli.length;l++){
          var p = progDi(a.id,l);
          var cls = p ? (superatoP(p) ? "fatto" : "provato") : "";
          punti += '<span class="punto '+cls+'"></span>';
        }
        html += '<button class="voce'+attiva+'" type="button" data-arg="'+a.id+'">'+
                '<span class="txt">'+esc(a.titolo)+(a.importato?' <span class="etichetta">tuo</span>':'')+'</span><span class="punti">'+punti+'</span></button>';
      });
    });
    var mancanti = ANNI.filter(function(y){ return !(m.anni[y]||[]).length; });
    if(mancanti.length){
      html += '<p class="rail-nota">'+mancanti.map(function(y){return y+"º";}).join(", ")+
              ' anno: da aggiungere su richiesta.</p>';
    }
    html += '</section>';
  });
  $rail.innerHTML = html;
  Array.prototype.forEach.call($rail.querySelectorAll("[data-arg]"), function(b){
    b.addEventListener("click", function(){
      apriArgomento(b.getAttribute("data-arg"));
      if(window.innerWidth<=900) $rail.classList.remove("aperto");
    });
  });
}

/* =================== pagina iniziale =================== */
function statistiche(){
  var tot=0, fatti=0, corretteTot=0, materieAttive=0;
  MATERIE.forEach(function(m){
    var n=0;
    for(var a in m.anni){ (m.anni[a]||[]).forEach(function(arg){ n++; tot += arg.livelli.length; }); }
    if(n) materieAttive++;
  });
  for(var id in S.prog){ for(var l in S.prog[id]){
    var p=S.prog[id][l];
    if(superatoP(p)) fatti++;
    corretteTot += (p.migliore||0);
  }}
  return {tot:tot, fatti:fatti, corrette:corretteTot, materie:materieAttive};
}
function primoLivelloAperto(){
  for(var mi=0;mi<MATERIE.length;mi++){
    var m=MATERIE[mi];
    for(var anno in m.anni){
      var lista=m.anni[anno]||[];
      for(var ai=0;ai<lista.length;ai++){
        var arg=lista[ai];
        for(var li=0;li<arg.livelli.length;li++){
          var p=progDi(arg.id,li);
          if(sbloccato(arg.id,li) && !superatoP(p)) return {mat:m,arg:arg,liv:li};
        }
      }
    }
  }
  return null;
}
function statoMateria(m){
  var livelli=0, fatti=0, primo=null;
  for(var anno in m.anni){ (m.anni[anno]||[]).forEach(function(arg){
    arg.livelli.forEach(function(_,i){
      livelli++;
      var p=progDi(arg.id,i);
      if(superatoP(p)) fatti++;
      if(!primo && sbloccato(arg.id,i) && !superatoP(p)) primo=arg;
    });
  }); }
  return {livelli:livelli,fatti:fatti,primo:primo,percent:livelli?Math.round(fatti/livelli*100):0};
}

/* =================== pagina argomento =================== */

/* =================== quiz =================== */
function avviaQuiz(argId, liv){
  var t = trovaArgomento(argId);
  if(!t || !sbloccato(argId, liv)) return;
  S.vista="quiz";
  S.quiz = { argId:argId, liv:liv, idx:0, risposte:[], guidati:{}, items:t.arg.livelli[liv].items.slice() };
  renderDomanda();
  window.scrollTo({top:0, behavior:"smooth"});
}
function renderDomanda(){
  var q = S.quiz, t = trovaArgomento(q.argId);
  var item = q.items[q.idx];
  var passi = "";
  for(var i=0;i<q.items.length;i++){
    passi += '<span class="passo '+(i<q.idx?"fatto":(i===q.idx?"ora":""))+'"></span>';
  }
  var h = '<section class="scheda quiz">'+
    '<div class="quiz-testa">'+
      '<div class="qt"><h2>'+esc(t.arg.titolo)+'</h2>'+
      '<div class="sub">'+esc(t.arg.livelli[q.liv].n)+' · esercizio '+(q.idx+1)+' di '+q.items.length+'</div></div>'+
      '<div class="passi">'+passi+'</div>'+
    '</div>'+
    '<div class="domanda">'+
      '<div class="num">Esercizio '+(q.idx+1)+'</div>'+
      '<div class="testo">'+item.q+'</div>';

  var guidato = !!q.guidati[q.idx];
  var guidaFinita = guidato && G && G.i >= G.passi.length;

  if(guidato){
    if(item.tipo==="scelta"){
      h += '<div class="opzioni" style="margin-bottom:18px">'+item.opz.map(function(o,i){
        return '<div class="opz sola"><span>'+String.fromCharCode(65+i)+'.</span><span>'+o+'</span></div>';
      }).join("")+'</div>';
    }
    h += '<div id="g-box">'+htmlGuida()+'</div>';
  } else if(item.tipo==="scelta"){
    h += '<div class="opzioni" id="opzioni">';
    item.opz.forEach(function(o,i){
      h += '<label class="opz" data-i="'+i+'"><input type="radio" name="scelta" id="opz-'+i+'" value="'+i+'"><span>'+o+'</span></label>';
    });
    h += '</div>';
  } else {
    h += '<div class="campo">'+
         '<input type="text" id="risposta" autocomplete="off" autocapitalize="off" spellcheck="false" '+
         'placeholder="Scrivi qui la tua risposta'+(item.num&&item.num.u?" (in "+esc(item.num.u)+")":"")+'" aria-label="La tua risposta">'+
         '</div>'+
         '<p class="suggerimento">Scrivi il risultato in forma semplice: per le potenze va bene sia <code>x^2</code> sia <code>x2</code>, il segno di moltiplicazione può essere omesso e la virgola decimale vale quanto il punto.</p>';
  }

  if(guidato){
    h += '<div class="azioni">'+
         (guidaFinita ? '<button class="btn" type="button" id="g-prosegui">Prosegui con il prossimo esercizio</button>' : '')+
         '<button class="btn ghost piccolo" type="button" id="esci">Esci dalla prova</button>'+
         '</div>'+
         '<p class="suggerimento">Esercizio svolto con la guida: non conta nel punteggio della batteria, ma lo ritrovi nella revisione finale.</p>'+
         '</div></section>';
  } else {
    h += '<div class="azioni">'+
         '<button class="btn" type="button" id="conferma">Conferma</button>'+
         '<button class="btn neutro" type="button" id="nonso">Non lo so</button>'+
         '<button class="btn ghost" type="button" id="guida">Svolgimento guidato</button>'+
         '<button class="btn ghost piccolo" type="button" id="esci">Esci dalla prova</button>'+
         '</div>'+
         '<p class="suggerimento">Le soluzioni compaiono tutte insieme alla fine della batteria. Con lo svolgimento guidato l’esercizio non conta nel punteggio.</p>'+
         '</div></section>';
  }

  $main.innerHTML = h;

  if(guidato){
    collegaGuida($main, renderDomanda);
    var pros = document.getElementById("g-prosegui");
    if(pros) pros.addEventListener("click", function(){ avanza(""); });
  } else {
    document.getElementById("guida").addEventListener("click", function(){
      if(!confirm("Con lo svolgimento guidato questo esercizio non conta nel punteggio della batteria. Vuoi continuare?")) return;
      q.guidati[q.idx] = true;
      nuovaGuida(q.argId, q.liv, q.idx, "quiz", null);
      renderDomanda();
    });

  var opzioni = document.getElementById("opzioni");
  if(opzioni){
    Array.prototype.forEach.call(opzioni.querySelectorAll(".opz"), function(l){
      l.addEventListener("click", function(){
        Array.prototype.forEach.call(opzioni.querySelectorAll(".opz"), function(x){ x.classList.remove("sel"); });

        l.querySelector("input").checked = true;
      });
    });

  if(input){

function conferma(){
  var item = S.quiz.items[S.quiz.idx];
  if(item.tipo==="scelta"){

    avanza(sel.value);
  } else {
    var v = document.getElementById("risposta").value;
    if(!v.trim()){ alert("Scrivi una risposta, oppure usa «Non lo so»."); return; }
    avanza(v);
  }
}
function avanza(valore){
  S.quiz.risposte.push(valore);
  S.quiz.idx++;
  if(S.quiz.idx >= S.quiz.items.length) chiudiQuiz();
  else renderDomanda();
}

/* =================== esito e revisione =================== */
function chiudiQuiz(){
  var q = S.quiz;
  var punti = 0;
  q.items.forEach(function(it,i){ if(corretta(it, q.risposte[i])) punti++; });
  q.punti = punti;
  registraEsito(q.argId, q.liv, punti, sogliaDi(trovaArgomento(q.argId).arg, q.liv), q.items.length);
  S.vista = "esito";
  renderRail();
  renderEsito();
  window.scrollTo({top:0, behavior:"smooth"});
}
function renderEsito(){
  var q = S.quiz, t = trovaArgomento(q.argId);
  var soglia = sogliaDi(t.arg, q.liv), tot = q.items.length;
  var superato = q.punti >= soglia;
  var ultimo = q.liv >= t.arg.livelli.length-1;
  var msg, titolo;
  if(q.punti===tot){ titolo="Batteria perfetta"; msg="Tutte giuste. Il livello successivo è aperto."; }
  else if(superato){ titolo="Livello superato"; msg="Hai raggiunto la soglia di "+soglia+"/"+tot+". Leggi comunque le soluzioni degli esercizi sbagliati prima di proseguire."; }
  else { titolo="Livello non superato"; msg="Servono almeno "+soglia+" risposte corrette su "+tot+". Studia le soluzioni qui sotto e rifai la batteria: gli esercizi sono gli stessi."; }
  if(superato && ultimo) msg = "Hai completato l’ultimo livello di questo argomento.";

  var h = '<section class="scheda quiz">'+
    '<div class="punteggio">'+
      '<div class="voto" style="color:'+(superato?"var(--ok)":"var(--err)")+'">'+q.punti+'<small>/'+tot+'</small></div>'+
      '<div class="msg"><h2>'+titolo+'</h2><p>'+msg+'</p></div>'+
    '</div>'+
    '<div class="revisione" id="revisione">'+
      '<p class="sez-sub" style="margin:0">Soluzione commentata di ogni esercizio. Per ciascuna puoi dire se hai capito oppure chiedere una spiegazione più estesa.</p>';

  q.items.forEach(function(it,i){
    var ok = corretta(it, q.risposte[i]);
    var conGuida = !!(q.guidati && q.guidati[i]);
    var tua = q.risposte[i];
    var tuaTxt = conGuida ? "(svolto con la guida)"
               : (tua===""||tua==null) ? "(nessuna risposta)"
               : (it.tipo==="scelta" ? it.opz[Number(tua)] : esc(tua));
    h += '<article class="rev '+(ok?"giusta":"sbagliata")+'" data-i="'+i+'">'+
      '<div class="rev-testa"><span class="n">'+(i+1)+'</span>'+
      '<span class="q">'+it.q+'</span>'+
      '<span class="esitino '+(ok?"ok":(conGuida?"guida":"no"))+'">'+(ok?"corretta":(conGuida?"con la guida":"da rivedere"))+'</span></div>'+
      '<div class="rev-corpo">'+

async function chiediSpiegazione(i, bottone){
  var box = document.getElementById("appr-"+i);
  var q = S.quiz, t = trovaArgomento(q.argId), it = q.items[i];
  box.hidden = false;

  if(!S.sample){
    box.textContent = "La spiegazione estesa automatica non è disponibile in questa sessione. "+
      "Rileggi la teoria in pillole dell’argomento e gli esempi svolti: l’esercizio riprende lo stesso schema. "+
      "In fondo alla pagina dell’argomento trovi anche i collegamenti a YouMath ed Edutecnica.";
    return;
  }

  bottone.disabled = true;
  box.textContent = "Sto preparando una spiegazione più estesa…";

  var tua = q.risposte[i];
  var tuaTxt = (tua===""||tua==null) ? "nessuna risposta" :
    (it.tipo==="scelta" ? String(it.opz[Number(tua)]).replace(/<[^>]+>/g,"") : String(tua));

  var richiesta =
    "Sei un insegnante di matematica e fisica di liceo scientifico e stai spiegando a uno studente del primo anno.\n\n"+
    "ARGOMENTO: "+t.arg.titolo+" ("+t.mat.nome+", 1º anno)\n"+
    "ESERCIZIO: "+String(it.q).replace(/<[^>]+>/g,"")+"\n"+
    "RISPOSTA DELLO STUDENTE: "+tuaTxt+"\n"+
    "RISPOSTA CORRETTA: "+String(rispostaGiusta(it)).replace(/<[^>]+>/g,"")+"\n"+
    "SPIEGAZIONE GIA’ FORNITA (lo studente dice di non averla capita): "+String(it.spieg).replace(/<[^>]+>/g,"")+"\n\n"+
    "Riparti da zero con parole diverse e più semplici. Struttura la risposta così:\n"+
    "1) Che cosa chiede davvero l’esercizio, in una frase.\n"+
    "2) La regola o la definizione che serve, enunciata in modo elementare.\n"+
    "3) Lo svolgimento passo per passo, spiegando il perché di ogni passaggio.\n"+
    "4) Dove nasce probabilmente l’errore dello studente (se ha risposto qualcosa).\n"+
    "5) Un esercizio molto simile da provare, con la sola risposta finale indicata alla fine.\n\n"+
    "Scrivi in italiano, in testo semplice senza LaTeX e senza tabelle, massimo 350 parole. "+
    "Usa notazioni leggibili come x^2, sqrt(x), 3/4.";

  try{
    var r = await S.sample(richiesta, {
      modelTier:"default",
      onText:function(ev){ box.textContent = ev.text; }
    });
    box.textContent = r.text;
  }catch(err){
    var code = err && err.code;
    if(code==="not_granted") box.textContent = "Per ottenere la spiegazione estesa serve il consenso richiesto dal browser. Riprova e accetta la richiesta.";
    else if(code==="rate_limited") box.textContent = "Troppe richieste ravvicinate. Aspetta qualche secondo e riprova.";
    else box.textContent = (err && err.text) ? err.text : "Non sono riuscito a generare la spiegazione estesa. Riprova fra poco.";
  }finally{
    bottone.disabled = false;
  }
}

/* =================== svolgimento guidato =================== */
/* Ogni esercizio può avere una guida scritta dall'autore (campo "guida": elenco di
   passi {s: suggerimento, r: passaggio atteso, k: chiavi per il controllo}). Se manca,
   la guida viene ricavata dalla spiegazione; su claude.ai si può anche chiederne una
   più dettagliata al modello. */
var G = null;   // stato della guida in corso

function testoPiano(s){ return String(s==null?"":s).replace(/<[^>]+>/g,""); }

function frasiDi(html){
  // spezza la spiegazione in frasi, senza tagliare dentro le formule $...$
  var t = testoPiano(html).replace(/\s+/g," ").trim();
  var out=[], cur="", inTex=false;
  for(var i=0;i<t.length;i++){
    var c=t.charAt(i); cur+=c;
    if(c==="$"){ inTex=!inTex; continue; }
    if(!inTex && c==="." && (i+1>=t.length || t.charAt(i+1)===" ")){
      if(cur.trim().length>2) out.push(cur.trim());
      cur="";
    }
  }
  if(cur.trim().length>2) out.push(cur.trim());
  return out;
}
function normPasso(p){
  return { s:String(p.s||"Scrivi il passaggio successivo."), r:String(p.r||""),
           k:Array.isArray(p.k)?p.k.map(String):[] };
}
function guidaAutomatica(item){
  var frasi = frasiDi(item.spieg), passi=[];
  if(item.tipo==="scelta"){
    var giusta = testoPiano(item.opz[item.ok]);
    passi.push({s:"Prima di guardare le opzioni, scrivi con parole tue la regola o la definizione che serve per rispondere.",
                r: frasi[0] || "Rileggi la pillola di teoria collegata a questo esercizio.", k:[]});
    if(frasi.length>1) passi.push({s:"Applica la regola al caso dell'esercizio e scrivi che cosa ne deduci.", r: frasi.slice(1).join(" "), k:[]});
    passi.push({s:"Ora scegli l'opzione corretta e scrivi in una riga perché le altre non vanno bene.",
                r:"Risposta: «"+esc(giusta)+"».", k:[giusta]});
    return passi;
  }
  var finale = (item.sol && item.sol.length) ? String(item.sol[0]) : (item.num ? String(item.num.v).replace(".",",") : "");
  var unita = item.num && item.num.u ? " "+item.num.u : "";
  var sugg = ["Individua i dati e l'incognita, poi scrivi la regola o la formula che userai.",
              "Sostituisci i dati nella formula e svolgi i calcoli, un'operazione per volta.",
              "Continua lo svolgimento: semplifica o completa il calcolo.",
              "Controlla il risultato parziale e prosegui."];
  var corpo = frasi.slice(0,4);
  corpo.forEach(function(f,i){ passi.push({s:sugg[Math.min(i,sugg.length-1)], r:f, k:[]}); });
  if(!corpo.length) passi.push({s:sugg[0], r:"Rileggi la teoria in pillole e gli esempi svolti: l'esercizio segue lo stesso schema.", k:[]});
  passi.push({s:"Scrivi la risposta finale"+(unita?", con l'unità di misura":"")+".",
              r:"Risposta finale: <code>"+esc(finale)+esc(unita)+"</code>", k:[finale]});
  return passi;
}
function controllaPasso(passo, testo){
  var t = normalizza(testo);
  if(!t) return "vuoto";
  var chiavi = passo.k || [];
  for(var i=0;i<chiavi.length;i++){ var c=normalizza(chiavi[i]); if(c && t.indexOf(c)>=0) return "ok"; }
  var nums = testoPiano(passo.r).replace(/\{,\}/g,",").match(/-?\d+(?:[.,]\d+)?/g);
  if(nums && nums.length){ var u=normalizza(nums[nums.length-1]); if(u && t.indexOf(u)>=0) return "ok"; }
  return "boh";
}
function passiPer(item){
  if(item._guidaAI && item._guidaAI.length) return {passi:item._guidaAI.map(normPasso), fonte:"ai"};
  if(Array.isArray(item.guida) && item.guida.length) return {passi:item.guida.map(normPasso), fonte:"autore"};
  return {passi:guidaAutomatica(item), fonte:"auto"};
}
function nuovaGuida(argId, liv, idx, host, ritorno){
  var t = trovaArgomento(argId); if(!t) return null;
  var item = t.arg.livelli[liv].items[idx];
  var pp = passiPer(item);
  G = {argId:argId, liv:liv, idx:idx, item:item, passi:pp.passi, fonte:pp.fonte, i:0, svolti:[], host:host, ritorno:ritorno};
  return G;
}
function htmlGuida(){
  var g=G, n=g.passi.length, h='<div class="guida">';
  var tappe=""; for(var j=0;j<n;j++) tappe+='<span class="tappa '+(j<g.i?"fatta":(j===g.i?"ora":""))+'"></span>';
  var fonte = g.fonte==="autore" ? "guida preparata con l’esercizio" : g.fonte==="ai" ? "guida generata su richiesta" : "guida ricavata dalla soluzione";
  h+='<div class="guida-testa"><span>'+(g.i<n?'Passaggio '+(g.i+1)+' di '+n:'Tutti i '+n+' passaggi svolti')+'</span>'+
     '<span class="tappe">'+tappe+'</span><span>· '+fonte+'</span></div>';
  g.svolti.forEach(function(sv,j){
    var p=g.passi[j];
    var v = sv.esito==="ok" ? '<span class="verdetto ok">✓ coincide con il passaggio atteso</span>'
          : sv.esito==="saltato" ? '<span class="verdetto saltato">passaggio mostrato</span>'
          : '<span class="verdetto boh">confronta con il passaggio atteso</span>';
    h+='<div class="passaggio"><div class="sugg"><b>Passo '+(j+1)+'</b><span>'+esc(p.s)+'</span></div><div class="corpo">'+
       '<dl class="confronto"><dt>Il tuo</dt><dd class="tuo">'+(sv.tuo?esc(sv.tuo):'<i style="color:var(--muted)">(non scritto)</i>')+'</dd>'+
       '<dt>Atteso</dt><dd>'+p.r+'</dd></dl>'+v+'</div></div>';
  });
  if(g.i<n){
    var p=g.passi[g.i];
    h+='<div class="passaggio"><div class="sugg"><b>Passo '+(g.i+1)+'</b><span>'+esc(p.s)+'</span></div><div class="corpo">'+
       '<textarea id="g-testo" placeholder="Scrivi qui il passaggio, come lo scriveresti sul quaderno" aria-label="Il tuo passaggio"></textarea>'+
       '<div class="azioni" style="margin-top:0"><button class="btn" type="button" id="g-fatto">Ho scritto il passaggio</button>'+
       '<button class="btn ghost" type="button" id="g-mostra">Mostrami il passaggio</button></div>'+
       '<p class="suggerimento" style="margin-top:0">Ctrl+Invio conferma. Dopo la conferma vedrai il passaggio atteso e il suggerimento successivo.</p></div></div>';
  } else {
    var ok=0, boh=0, salt=0;
    g.svolti.forEach(function(sv){ if(sv.esito==="ok") ok++; else if(sv.esito==="saltato") salt++; else boh++; });
    h+='<div class="guida-fine"><b>Risoluzione completata</b>'+
       '<span>Passaggi che coincidono: '+ok+' · da confrontare: '+boh+' · mostrati: '+salt+'.</span>'+
       '<span>Se un passaggio non ti è chiaro, rileggi la teoria in pillole e l’esempio svolto più simile.</span></div>';
  }
  h+='</div>';
  return h;
}
function collegaGuida(root, alTermine){
  var ta=root.querySelector("#g-testo");
  if(!ta) return;
  ta.focus();
  ta.addEventListener("keydown", function(ev){
    if(ev.key==="Enter" && (ev.ctrlKey||ev.metaKey)){ ev.preventDefault(); root.querySelector("#g-fatto").click(); }
  });
  root.querySelector("#g-fatto").addEventListener("click", function(){
    var v=ta.value;
    if(!v.trim()){ alert("Scrivi il passaggio, oppure usa «Mostrami il passaggio»."); return; }
    G.svolti.push({tuo:v, esito:controllaPasso(G.passi[G.i], v)}); G.i++; alTermine();
  });
  root.querySelector("#g-mostra").addEventListener("click", function(){
    G.svolti.push({tuo:"", esito:"saltato"}); G.i++; alTermine();
  });
}
function avviaGuida(argId, liv, idx, ritorno){

function riavviaGuida(){

function renderGuida(){

  var h='<section class="scheda quiz">'+

function tornaDaGuida(){

async function generaGuidaAI(bottone){
  var g=G, t=trovaArgomento(g.argId), it=g.item;
  if(!S.sample) return;
  bottone.disabled=true; bottone.textContent="Sto preparando la guida…";
  var richiesta =
    "Sei un insegnante di matematica e fisica di liceo scientifico. Prepara una guida allo svolgimento passo per passo per questo esercizio.\n"+
    "ARGOMENTO: "+t.arg.titolo+"\nESERCIZIO: "+testoPiano(it.q)+"\n"+
    (it.tipo==="scelta" ? "OPZIONI: "+it.opz.map(function(o,i){ return (i+1)+") "+testoPiano(o); }).join("; ")+"\n" : "")+
    "RISPOSTA CORRETTA: "+testoPiano(rispostaGiusta(it))+"\nSPIEGAZIONE: "+testoPiano(it.spieg)+"\n\n"+
    "Rispondi SOLO con un array JSON di 3-5 oggetti {\"s\":..., \"r\":..., \"k\":[...]}: "+
    "s = che cosa deve scrivere lo studente in questo passaggio, in forma imperativa, senza rivelare il risultato; "+
    "r = il passaggio svolto come dovrebbe risultare, conciso, in testo semplice senza LaTeX (usa x^2, 3/4, 0,5); "+
    "k = 1-3 stringhe brevi (numeri o parole chiave) che un passaggio corretto contiene. "+
    "L'ultimo r deve contenere la risposta finale. Italiano, dai del tu.";
  try{
    var r = await S.sample(richiesta, {modelTier:"default"});
    var m = String(r && r.text || "").match(/\[[\s\S]*\]/);
    var arr = JSON.parse(m ? m[0] : "[]");
    if(!Array.isArray(arr) || !arr.length) throw new Error("vuoto");
    it._guidaAI = arr.map(normPasso).map(function(p){ p.r = esc(p.r); return p; });
    riavviaGuida();
  }catch(e){
    bottone.disabled=false; bottone.textContent="Non sono riuscito a generare la guida: riprova";
  }
}

/* =================== scheda, esportazione e importazione dei progressi =================== */
/* La scheda (nome, nickname, email) resta in questo browser. Nel file esportato vanno nome,
   nickname e un'impronta dell'email, non l'indirizzo: serve solo a riconoscere, all'importazione,
   se il file appartiene alla stessa persona. */
var CHIAVE_PROFILO = "quaderno-quadretti-profilo";
var FORMATO_EXPORT = "quaderno-quadretti-progressi";

function impronta(email){
  // impronta a 53 bit (cyrb53) dell'email normalizzata: non è crittografica, ma dall'impronta non si risale all'indirizzo
  var s = String(email||"").trim().toLowerCase(), h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for(var i=0;i<s.length;i++){ var ch=s.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1 = Math.imul(h1^(h1>>>16),2246822507); h1 ^= Math.imul(h2^(h2>>>13),3266489909);
  h2 = Math.imul(h2^(h2>>>16),2246822507); h2 ^= Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(16);
}
function caricaProfilo(){
  try{ var r=localStorage.getItem(CHIAVE_PROFILO); if(r){ var p=JSON.parse(r); if(p&&typeof p==="object") return p; } }catch(e){}
  return {};
}
function salvaProfilo(p){ try{ localStorage.setItem(CHIAVE_PROFILO, JSON.stringify(p)); }catch(e){} }
function emailValida(e){ return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(e||"").trim()); }
function profiloCompleto(p){ return !!(p && String(p.nick||"").trim() && emailValida(p.email)); }

function pacchettoExport(){
  var p = caricaProfilo();
  return { formato:FORMATO_EXPORT, versione:1, esportato:new Date().toISOString(),
           profilo:{ nome:String(p.nome||""), nick:String(p.nick||""), impronta:p.impronta || impronta(p.email) },
           progressi:S.prog, importati:caricaImportati() };
}
/* Codice testuale: "QQ1Z:" + base64 del JSON compresso (deflate) se il browser lo sa fare,
   altrimenti "QQ1:" + base64 del JSON. */
function bytesToB64(u8){ var s=""; for(var i=0;i<u8.length;i++) s+=String.fromCharCode(u8[i]); return btoa(s); }
function b64ToBytes(b){ var s=atob(b), u=new Uint8Array(s.length); for(var i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }
async function codificaPacchetto(obj){
  var bytes = new TextEncoder().encode(JSON.stringify(obj));
  if(typeof CompressionStream==="function"){
    try{
      var buf = await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer();
      return "QQ1Z:"+bytesToB64(new Uint8Array(buf));
    }catch(e){}
  }
  return "QQ1:"+bytesToB64(bytes);
}
async function decodificaPacchetto(testo){
  var t = String(testo||"").trim();
  if(t.charAt(0)==="{") return JSON.parse(t);
  var m = t.match(/^(QQ1Z?):([\s\S]+)$/);
  if(!m) throw new Error("Il testo incollato non è un codice dei progressi del Quaderno.");
  var bytes = b64ToBytes(m[2].replace(/\s+/g,""));
  if(m[1]==="QQ1Z"){
    if(typeof DecompressionStream!=="function") throw new Error("Questo browser non sa leggere il codice compresso: usa il file JSON.");
    var buf = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer();
    bytes = new Uint8Array(buf);
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}
function validaPacchetto(obj){
  if(!obj || typeof obj!=="object" || obj.formato!==FORMATO_EXPORT) throw new Error("Il file non è un'esportazione dei progressi del Quaderno.");
  if(Number(obj.versione)>1) throw new Error("Il file viene da una versione più recente del Quaderno: ricarica la pagina e riprova.");
  var prog = (obj.progressi && typeof obj.progressi==="object") ? obj.progressi : {}, pulito = {}, livelli = 0;
  for(var id in prog){
    if(!prog[id] || typeof prog[id]!=="object") continue;
    pulito[id] = {};
    for(var l in prog[id]){
      var v = prog[id][l];
      if(!v || typeof v!=="object" || typeof v.migliore!=="number") continue;
      pulito[id][l] = { migliore:v.migliore, tentativi:Number(v.tentativi)||0, ultimo:v.ultimo, data:v.data, soglia:v.soglia, totale:v.totale };
      livelli++;
    }
  }
  var imp = Array.isArray(obj.importati) ? obj.importati.filter(function(x){ return x && x.id && x.titolo && Array.isArray(x.livelli); }) : [];
  var pr = (obj.profilo && typeof obj.profilo==="object") ? obj.profilo : {};
  return { profilo:{ nome:String(pr.nome||""), nick:String(pr.nick||""), impronta:String(pr.impronta||"") },
           progressi:pulito, importati:imp, livelli:livelli, esportato:obj.esportato };
}
function fondiProgressi(remoti){
  // per ogni livello: miglior risultato, somma dei tentativi, ultimo esito dal salvataggio più recente
  for(var id in remoti){
    if(!S.prog[id]) S.prog[id] = {};
    for(var l in remoti[id]){
      var r = remoti[id][l], loc = S.prog[id][l];
      if(!loc){ S.prog[id][l] = r; continue; }
      var rec = (String(r.data||"") > String(loc.data||"")) ? r : loc;
      S.prog[id][l] = { migliore:Math.max(loc.migliore||0, r.migliore||0), tentativi:(loc.tentativi||0)+(r.tentativi||0),
                        ultimo:rec.ultimo, data:rec.data, soglia:rec.soglia||loc.soglia, totale:rec.totale||loc.totale };
    }
  }
}
function applicaPacchetto(v, modo){
  if(modo==="sostituisci"){ S.prog = v.progressi; salvaImportati(v.importati); }
  else {
    fondiProgressi(v.progressi);
    var lista = caricaImportati();
    v.importati.forEach(function(x){ if(!lista.some(function(y){ return y.id===x.id; })) lista.push(x); });
    salvaImportati(lista);
  }
  salvaProgressi(); montaImportati(); renderRail();
}

/* =================== importazione di esercizi =================== */
/* Un file JSON con un argomento (stesso schema dei file dei contenuti) oppure solo
   {titolo, materia, anno, items:[...]} oppure un semplice elenco di esercizi.
   Le batterie importate restano nel browser e compaiono nell'indice come argomenti. */
var CHIAVE_IMPORT = "quaderno-quadretti-importati";
var MODELLO_IMPORT = {
  titolo:"Equazioni di primo grado (prova)", materia:"matematica", anno:1,
  sommario:"Batteria di prova preparata dall'insegnante.",
  livelli:[{ n:"Livello 1 - Base", d:"Equazioni con una sola incognita.", items:[
    { q:"Risolvi: $2x+3=11$", tipo:"aperta", sol:["4","x=4"], num:{v:4,tol:0},
      spieg:"Porto il 3 a destra: $2x=8$, quindi $x=4$.",
      guida:[ {s:"Isola il termine con la x portando i numeri a destra.", r:"$2x=11-3=8$", k:["2x=8"]},
              {s:"Dividi entrambi i membri per il coefficiente della x.", r:"$x=8:2=4$", k:["4"]} ] },
    { q:"Un'equazione di primo grado ha al massimo:", tipo:"scelta",
      opz:["nessuna soluzione","una soluzione","due soluzioni","infinite soluzioni"], ok:1,
      spieg:"Se il coefficiente della x non è zero la soluzione è una sola." }
  ]}]
};
function caricaImportati(){
  try{ var raw=localStorage.getItem(CHIAVE_IMPORT); if(raw){ var l=JSON.parse(raw); if(Array.isArray(l)) return l; } }catch(e){}
  return [];
}
function salvaImportati(l){ try{ localStorage.setItem(CHIAVE_IMPORT, JSON.stringify(l)); }catch(e){} }
function montaImportati(){
  var imp = caricaImportati();
  MATERIE.forEach(function(m){
    if(!m.base){ m.base={}; for(var a in m.anni) m.base[a]=m.anni[a]; }
    m.anni={}; for(var b in m.base) m.anni[b]=m.base[b].slice();
    imp.filter(function(x){ return x.materia===m.id; }).forEach(function(x){
      var y = x.anno||1; if(!m.anni[y]) m.anni[y]=[];
      m.anni[y].push(x);
    });
  });
}
function slug(s){
  return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40) || "esercizi";
}
function validaImport(src, materiaDefault, annoDefault){
  var err=[], obj=src;
  if(Array.isArray(obj)) obj = {items:obj};
  if(!obj || typeof obj!=="object") return {errori:["Il file deve contenere un oggetto JSON oppure un elenco di esercizi."]};
  var livelli;
  if(Array.isArray(obj.livelli)) livelli = obj.livelli;
  else if(Array.isArray(obj.items)) livelli = [{n:"Livello 1 - Esercizi importati", d:"Batteria importata.", items:obj.items}];
  else return {errori:["Manca l’elenco degli esercizi: serve «livelli» oppure «items»."]};
  if(!livelli.length) err.push("«livelli» è vuoto.");
  var materia = String(obj.materia||materiaDefault);
  if(!MATERIE.some(function(m){ return m.id===materia; })) err.push("Materia sconosciuta: "+materia+".");
  var anno = Number(obj.anno||annoDefault);
  if(ANNI.indexOf(anno)<0) err.push("Anno non valido: "+obj.anno+".");
  var titolo = String(obj.titolo || "Esercizi importati "+new Date().toLocaleDateString("it-IT"));
  var out = {
    id: String(obj.id || "imp-"+slug(titolo)+"-"+Date.now().toString(36)),
    titolo:titolo, sommario:String(obj.sommario||"Batteria di esercizi importata."), materia:materia, anno:anno, importato:true,
    pillole: Array.isArray(obj.pillole)?obj.pillole.filter(function(p){ return p&&p.t&&p.c; }):[],
    formule: Array.isArray(obj.formule)?obj.formule.filter(function(f){ return f&&f.n&&f.f; }):[],
    esempi:  Array.isArray(obj.esempi)?obj.esempi.filter(function(e){ return e&&e.t&&Array.isArray(e.passi)&&e.r; }):[],
    risorse: Array.isArray(obj.risorse)?obj.risorse.filter(function(r){ return r&&/^https?:\/\//.test(r.u||"")&&r.t; })
              .map(function(r){ return {t:String(r.t), u:String(r.u), f:String(r.f||"Link")}; }):[],
    livelli:[]
  };
  livelli.forEach(function(l, li){
    if(!l || !Array.isArray(l.items) || !l.items.length){ err.push("Livello "+(li+1)+": manca «items» o è vuoto."); return; }
    var lv = { n:String(l.n||("Livello "+(li+1))), d:String(l.d||""), items:[] };
    l.items.forEach(function(it, ii){
      var tag="Livello "+(li+1)+", esercizio "+(ii+1)+": ";
      if(!it || typeof it!=="object" || !it.q){ err.push(tag+"manca il testo «q»."); return; }
      var o = { q:String(it.q), tipo: it.tipo==="scelta"?"scelta":"aperta",
                spieg:String(it.spieg||"Nessuna spiegazione fornita per questo esercizio.") };
      if(o.tipo==="scelta"){
        if(!Array.isArray(it.opz) || it.opz.length<2){ err.push(tag+"servono almeno due opzioni in «opz»."); return; }
        o.opz = it.opz.map(String); o.ok = Number(it.ok);
        if(!(Number.isInteger(o.ok) && o.ok>=0 && o.ok<o.opz.length)){ err.push(tag+"«ok» deve essere l’indice (da 0) dell’opzione corretta."); return; }
      } else {
        if(it.num && typeof it.num.v==="number"){
          o.num = {v:it.num.v, tol: typeof it.num.tol==="number" ? it.num.tol : 0.01};
          if(it.num.u) o.num.u = String(it.num.u);
        }
        var sol = Array.isArray(it.sol) ? it.sol.map(String).filter(Boolean) : (it.sol!=null ? [String(it.sol)] : []);
        if(!sol.length && o.num) sol=[String(o.num.v).replace(".",",")];
        if(!sol.length){ err.push(tag+"serve «sol» (elenco di risposte accettate) oppure «num»."); return; }
        o.sol = sol;
      }
      if(Array.isArray(it.guida) && it.guida.length){
        o.guida = it.guida.filter(function(p){ return p&&p.s&&p.r; }).map(normPasso);
        if(!o.guida.length) delete o.guida;
      }
      lv.items.push(o);
    });
    out.livelli.push(lv);
  });
  if(err.length) return {errori:err};
  return {arg:out, n:out.livelli.reduce(function(a,l){ return a+l.items.length; },0)};
}

      delete S.prog[id]; salvaProgressi(); montaImportati(); renderRail(); renderHome();
    });
  });
}

/* =================== avvio =================== */
document.getElementById("tgl-indice").addEventListener("click", function(){
  $rail.classList.toggle("aperto");
});
document.getElementById("vai-home").addEventListener("click", function(){
  S.vista="home"; S.argomento=null; S.materia=null;
  renderRail(); renderHome();
  window.scrollTo({top:0, behavior:"smooth"});
});

S.prog = caricaLocale();
montaImportati();
renderRail();
renderHome();

if(window.MathJax && window.MathJax.startup && window.MathJax.startup.promise){
  window.MathJax.startup.promise.then(function(){ S.mathPronto=true; tex($main); tex($rail); });
}

if(window.claude && typeof window.claude.use === "function"){
  window.claude.use("db").then(function(db){
    if(!db) return;
    S.db = db;
    $badge.textContent = "progressi salvati sull’account";
    $badge.classList.add("on");
    return db.doc("progressi/studente").get().then(function(snap){
      if(snap && snap.exists){
        var remoti = (snap.data()||{}).argomenti || {};
        // unione: per ogni livello si tiene il miglior risultato fra locale e remoto
        for(var id in remoti){
          if(!S.prog[id]) S.prog[id] = {};
          for(var l in remoti[id]){
            var r = remoti[id][l], loc = S.prog[id][l];
            if(!loc || (r.migliore||0) > (loc.migliore||0)) S.prog[id][l] = r;
          }
        }
        salvaLocale();
        renderRail();
        if(S.vista==="home") renderHome();
        else if(S.vista==="argomento"){ var t=trovaArgomento(S.argomento); if(t) renderArgomento(t); }
      }
    });
  }).catch(function(){});

  window.claude.use("sample").then(function(s){ if(s) S.sample = s; }).catch(function(){});
}

})();
</script>
